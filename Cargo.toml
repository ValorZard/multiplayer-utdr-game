[workspace]
resolver = "3"
members = ["client", "rpc", "server"]

[workspace.dependencies]
rkyv = { version = "0.8.16", features = ["uuid-1"] }
bytes = "1.11.1"
tokio = {version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls-vendored"] }
tokio-stream = "0.1"
uuid = {version = "1.23.2", features = ["v4", "rng-getrandom"] }