[package]
name = "server"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
shared = {path = "../shared" }
futures-util = "0.3.32"
tokio = {workspace = true}
web-transport-quinn = "0.11.9"
tokio-stream = {workspace = true}
uuid = {workspace = true }
anyhow = "1.0.102"
rustls = { version = "0.23.40", features = ["ring"] }
clap = { version = "4", features = ["derive"] }
rustls-pemfile = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
rapier2d = {workspace = true}
hecs = {workspace = true}
dotenvy = "0.15.7"
oauth2 = "5.0.0"
url = {workspace = true}
axum = "0.8.9"
axum-server = { version = "0.8", features = ["tls-rustls"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "sqlx-toml", "macros", "migrate"] }
tower-http = { version = "0.7", features = ["fs"] }