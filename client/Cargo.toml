[package]
name = "client"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = {version = "1"}
shared = {path = "../shared" }
futures-util = "0.3"
futures-channel = "0.3"
kiss3d = { version = "0.45.1", features = ["egui"]}
rkyv = {workspace = true}
bytes = {workspace = true}
console_error_panic_hook = "0.1.7"
futures = "0.3.32"
web-transport = {workspace = true}
url = "2.5.8"
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
rapier2d = {workspace = true}
hecs = {workspace = true}
webbrowser = "1.2.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = {workspace = true}
tokio-stream = {workspace = true}
time = "0.3.47"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = "0.3"
gloo-timers = { version = "0.4.0", features = ["futures"] }
time = { version = "0.3.47", features = ["wasm-bindgen"] }
gloo-net = { version = "0.7.0", default-features = false, features = ["http"] }

